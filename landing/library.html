  <section class="pc-library pc-wrap" id="pc-library" aria-labelledby="pc-library-title">
    <div class="pc-section-heading"><div><p class="pc-eyebrow">WHAT YOU CAN DO</p><h1 id="pc-library-title">All workflows</h1></div><p>Search by the work you want to do.</p></div>
    <span id="pc-sources" aria-hidden="true"></span>

    <div class="pc-library-filters"><label class="pc-field">Search capabilities<input id="pc-library-search" type="search" placeholder="Try sales research, PRD, OCR, or video…"></label><label class="pc-field">Category<select id="pc-library-family" aria-label="Category"><option value="all">All categories</option>{{FAMILY_OPTIONS}}</select></label><button id="pc-library-reset" class="pc-button" type="button">Reset filters</button></div>
    <p id="pc-library-results" class="pc-library-status" role="status">Choose a workflow.</p>
    <div class="pc-grid">{{CAPABILITY_CARDS}}</div>
    <p id="pc-library-empty" hidden>No capabilities match. Try another search or reset the filters.</p>
  </section>
