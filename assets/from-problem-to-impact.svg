<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="t d"><title id="t">From customer problem to product impact</title><desc id="d">Five connected power stages: discover, decide, design and build, ship, measure and learn</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11182c"/><stop offset="1" stop-color="#090b16"/></linearGradient><linearGradient id="line"><stop stop-color="#45d9ff"/><stop offset=".55" stop-color="#ab56ff"/><stop offset="1" stop-color="#ffb036"/></linearGradient></defs><rect width="1200" height="260" rx="20" fill="url(#bg)"/><g fill="#ccd6ef" font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="16" letter-spacing="3" fill="#9badcf">FIELD PROBLEM → SHIPPED IMPACT</text><text x="1145" y="54" font-size="38" text-anchor="end" fill="#ffbc50">⚡</text></g><path d="M116 150H1080" fill="none" stroke="url(#line)" stroke-width="5" opacity=".9"/><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-weight="bold" font-size="19"><g><rect x="20" y="101" width="216" height="102" rx="15" fill="#141f36" stroke="#2cd8ff"/><text x="128" y="143" fill="#8eeaff">01 · DISCOVER</text><text x="128" y="173" font-size="14" font-weight="normal" fill="#c2d3ec">Talk • research • map</text></g><g><rect x="253" y="101" width="215" height="102" rx="15" fill="#141f36" stroke="#8361ff"/><text x="360" y="143" fill="#c1a6ff">02 · DECIDE</text><text x="360" y="173" font-size="14" font-weight="normal" fill="#c2d3ec">Prioritize • quantify</text></g><g><rect x="485" y="101" width="231" height="102" rx="15" fill="#141f36" stroke="#f159bf"/><text x="600" y="143" fill="#ffadcf">03 · BUILD</text><text x="600" y="173" font-size="14" font-weight="normal" fill="#c2d3ec">Prototype • integrate</text></g><g><rect x="733" y="101" width="213" height="102" rx="15" fill="#141f36" stroke="#ffb241"/><text x="839" y="143" fill="#ffcd7e">04 · SHIP</text><text x="839" y="173" font-size="14" font-weight="normal" fill="#c2d3ec">Test • release</text></g><g><rect x="963" y="101" width="216" height="102" rx="15" fill="#141f36" stroke="#42e9a5"/><text x="1071" y="143" fill="#8bf0c2">05 · LEARN</text><text x="1071" y="173" font-size="14" font-weight="normal" fill="#c2d3ec">Measure • improve</text></g></g><text x="44" y="239" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#748cb6">52 capabilities  •  12 families  •  Infinite combinations</text></svg>