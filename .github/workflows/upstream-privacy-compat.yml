name: Power Chords public-upstream privacy compatibility
on:
  pull_request:
    paths:
      - 'src/upstream-references.mjs'
      - 'src/catalog.mjs'
      - 'src/db.mjs'
      - 'src/github.mjs'
      - 'test/private-fork-compatibility.test.mjs'
      - '.github/workflows/upstream-privacy-compat.yml'
permissions:
  contents: read
jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check src/upstream-references.mjs
      - run: node --check src/github.mjs
      - run: node --test test/private-fork-compatibility.test.mjs
