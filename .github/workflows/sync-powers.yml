name: Check Power Chords refresh draft

# Refresh preparation is scheduled in Codex on Saturday at 08:00 IST.
# This workflow cannot push, publish a release, or deploy Pages.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run validate:catalog
      - run: npm run validate:capabilities
      - run: npm test
      - run: npm run build:site
