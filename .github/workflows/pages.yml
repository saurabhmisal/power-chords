name: Publish Power Chords website
on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Exact 40-character main commit approved after reviewing the publication proposal
        required: true
        type: string
      approval:
        description: Enter APPROVED only after the user explicitly approves this release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: power-chords-website
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require a specific approved release
        env:
          APPROVAL: ${{ inputs.approval }}
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: |
          test "$APPROVAL" = APPROVED
          [[ "$APPROVED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_commit }}
          fetch-depth: 0
      - name: Verify approved commit belongs to main
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: git merge-base --is-ancestor "$APPROVED_COMMIT" origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run validate:catalog
      - run: npm run validate:capabilities
      - run: npm test
      - run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
